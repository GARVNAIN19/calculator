<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
    <script src="calculator.js" defer></script>
</head>
<body>
    <main class="calculator">
       
        
        <input type="text" id="display" aria-label="Calculator display" readonly>
        <div id="keys">
        <button class="displybtn">7</button>
        <button class="displybtn" >8</button>
        <button class="displybtn">9</button>
        <button class="op-btns">/</button>
        <button class="displybtn">4</button>
        <button class="displybtn">5</button>
        <button class="displybtn">6</button>
        <button class="op-btns">*</button>
        <button class="displybtn">1</button>
        <button class="displybtn">2</button>
        <button class="displybtn">3</button>
        <button class="op-btns">-</button>
        <button class="displybtn">0</button>
        <button class="displybtn">.</button>
        <button class="displybtn">=</button>
        <button class="op-btns">+</button>
        <button class="op-btns">C</button>

        </div>
    </main>

</body>
</html>
